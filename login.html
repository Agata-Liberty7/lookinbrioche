<!DOCTYPE html>
<html lang="ru">
<head>
  <meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FAF6F0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Look-in Brioche — Вход</title>
<link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32-v7.png">
  <link rel="shortcut icon" type="image/png" href="/icons/favicon-32-v7.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-v7.png">
  <link rel="manifest" href="/manifest.json?v=7">
  <script defer src="analytics.js"></script>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <img class="login-logo" alt="" style="visibility:hidden">
    <h1 class="login-title" id="lt">Look-in Brioche</h1>
    <p class="login-tagline" id="ls">Pan y Empanadillas Artesanos</p>
    <div class="form-group"><label id="lbl-user"></label><input type="text" id="inp-login" autocomplete="username" autocapitalize="none"></div>
    <div class="form-group"><label id="lbl-pass"></label><input type="password" id="inp-pass" autocomplete="current-password"></div>
    <div id="err-msg" style="color:#c0392b;font-size:14px;margin-bottom:12px;display:none"></div>
    <button class="btn btn-primary" style="width:100%;padding:13px;font-size:16px;margin-bottom:12px;border-radius:var(--r)" onclick="doLogin()" id="btn-login"></button>
    <div style="text-align:center;border-top:1px solid var(--bdr2);padding-top:16px;display:flex;justify-content:space-between">
      <a href="index.html" style="font-size:13px;color:var(--text3);text-decoration:none">← Vitrina</a>
      <a href="admin.html" style="font-size:13px;color:var(--text3);text-decoration:none">🔑 Admin</a>
    </div>
  </div>

  <div style="margin-top:16px;display:flex;gap:8px">
    <button class="lang-btn" onclick="setLang('ru')">RU</button>
    <button class="lang-btn" onclick="setLang('en')">EN</button>
    <button class="lang-btn" onclick="setLang('es')">ES</button>
  </div>
</div>
<div id="toast" class="toast"></div>
<script src="i18n.js"></script>
<script src="core.js"></script>
<script type="module">
import { fbGetSettings, fbFindClient, fbRecordClientLogin } from './firebase.js?v=login-stats1';

applyTheme(); applyFont();

async function initLogin() {
  try {
    const s = await fbGetSettings();
    if (s) { window._settings = Object.assign({}, window._settings||{}, s); saveSettingsCache(window._settings); applyTheme(); applyFont(); }
  } catch(e) {}
  const s = getSettings();
  const loginLogo = document.querySelector('.login-logo');
  if (loginLogo && s.logo) {
    loginLogo.onload = () => {
      loginLogo.style.visibility = 'visible';
    };
    loginLogo.src = s.logo;
  }
  document.getElementById('lt').textContent  = s.shopName || 'Look-in Brioche';
  document.getElementById('ls').textContent  = s.shopTagline || 'Pan y Empanadillas Artesanos';
  document.getElementById('lbl-user').textContent  = t('username');
  document.getElementById('lbl-pass').textContent  = t('password');
  document.getElementById('btn-login').textContent = t('loginBtn');
  document.title = (s.shopName || 'Look-in Brioche') + ' — ' + t('loginTitle');
}

document.getElementById('inp-pass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });

window.doLogin = async () => {
  const login=document.getElementById('inp-login').value.trim();
  const pass=document.getElementById('inp-pass').value;
  const err=document.getElementById('err-msg');
  try {
    showLoading('');
    const client = await fbFindClient(login, pass);
    hideLoading();
    if (client) {
      setCurrentUser(client);

      sessionStorage.setItem('clientJustLoggedIn', '1');

      fbRecordClientLogin(client.id).catch(statsError => {
        console.warn('Could not record client login:', statsError);
      });

      window.location.href='shop.html';
    }
    else { err.textContent=t('loginError'); err.style.display='block'; }
  } catch(e) { hideLoading(); err.textContent=t('loginError'); err.style.display='block'; }
};

if (getCurrentUser()) window.location.href='shop.html';
initLogin();
</script>
</body>
</html>
